      <text x="73" y="70" font-size="14" font-weight="600" letter-spacing="3" fill="#81D9CD">CIVIL ENGINEERING MEETS CODE</text>
      <text x="54" y="164" font-size="70" font-weight="700" letter-spacing="-2" fill="#F0F6FC">Hey, I'm Cole.</text>
      <text x="58" y="214" font-size="23" fill="#ABC0D0">Roadway design. Geospatial workflows.</text>
      <text x="58" y="250" font-size="23" fill="#ABC0D0">Software that makes both better.</text>
      <line x1="58" y1="285" x2="620" y2="285" stroke="#344B59"/>
      <text x="58" y="327" font-size="17" font-weight="600" fill="#DDE9EF">DESIGN ROADS.</text>
      <text x="214" y="327" font-size="17" font-weight="600" fill="#81D9CD">BUILD USEFUL TOOLS.</text>
      <text x="1060" y="356" font-size="13" letter-spacing="2" fill="#8AACB7">&lt; / &gt;</text>
    </g>
